[project]
name = "calcul-scientifique"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Réda Bensouda", email = "redabenspro@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
calcul-scientifique = "calcul_scientifique:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "spyder-kernels>=3.1.6",
]
